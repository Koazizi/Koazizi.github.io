name: Sync UHR Lab branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lab-brand.yml'

permissions:
  contents: write

jobs:
  sync-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make remaining pages lab-first
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              '<span class="brand__mark">Koorosh Azizi</span><span class="brand__sub">UHR Lab &middot; Tennessee State University</span>': '<span class="brand__mark">UHR Lab</span><span class="brand__sub">Tennessee State University</span>',
              '<span class="brand__mark">Koorosh Azizi</span><span class="brand__sub">Urban Hydrosystems &amp; Resilience Lab</span>': '<span class="brand__mark">UHR Lab</span><span class="brand__sub">Tennessee State University</span>',
              '<span class="brand__mark">Koorosh Azizi</span>\n      <span class="brand__sub">Urban Hydrosystems &amp; Resilience Lab</span>': '<span class="brand__mark">UHR Lab</span>\n      <span class="brand__sub">Tennessee State University</span>',
              '>About</a>': '>People</a>',
          }

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('updated', path)
      - name: Commit branding sync
        shell: bash
        run: |
          git config user.name "Koorosh Azizi"
          git config user.email "KOOROSH.AZIZI.92@GMAIL.COM"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No branding changes needed."
          else
            git commit -m "Use UHR Lab branding across all pages"
            git push
          fi
