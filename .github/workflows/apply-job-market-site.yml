name: Apply job-market website revision

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-job-market-site.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify revised site
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import json
          import tarfile
          from html.parser import HTMLParser
          from pathlib import Path

          chunks = sorted(Path('.github/site-revision').glob('chunk*.txt'))
          if len(chunks) != 6:
              raise SystemExit(f'Expected 6 archive chunks, found {len(chunks)}')

          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          archive = base64.b64decode(payload)
          digest = hashlib.sha256(archive).hexdigest()
          expected_digest = 'fff1d94cef231b00b1ba1112efc81540c500860e77610fa3099a8cd8e9411e69'
          if digest != expected_digest:
              raise SystemExit(f'Archive checksum mismatch: {digest}')

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              tf.extractall(path='.', filter='data')

          expected = [
              'index.html',
              'research.html',
              'people.html',
              'teaching.html',
              'publications.html',
              'news.html',
              'join.html',
              'contact.html',
              'sitemap.xml',
              'assets/css/refinement.css',
              'assets/css/refinement-identity.css',
              'assets/css/refinement-pages.css',
              'assets/css/refinement-responsive.css',
              'assets/img/CREDITS.md',
          ]
          missing = [item for item in expected if not Path(item).is_file()]
          if missing:
              raise SystemExit(f'Missing extracted files: {missing}')

          class CheckHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.h1 = 0
                  self.ids = []
                  self.canonical = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'h1':
                      self.h1 += 1
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'link' and attrs.get('rel') == 'canonical':
                      self.canonical = True

          for item in expected:
              if not item.endswith('.html'):
                  continue
              text = Path(item).read_text(encoding='utf-8')
              parser = CheckHTML()
              parser.feed(text)
              if parser.h1 != 1:
                  raise SystemExit(f'{item}: expected one h1, found {parser.h1}')
              if len(parser.ids) != len(set(parser.ids)):
                  raise SystemExit(f'{item}: duplicate element IDs')
              if not parser.canonical:
                  raise SystemExit(f'{item}: missing canonical URL')
              if 'assets/img/figures/' in text:
                  raise SystemExit(f'{item}: paper figure reference found')
              if '14 Nov 2026' in text or '2026-11-14' in text:
                  raise SystemExit(f'{item}: obsolete TSU seminar date found')

          json.loads(Path('site-manifest.json').read_text(encoding='utf-8')) if Path('site-manifest.json').exists() else None
          print('Revision archive and HTML structure verified.')

      - name: Commit the coordinated revision
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html research.html people.html teaching.html publications.html news.html join.html contact.html sitemap.xml assets/css/refinement*.css assets/img/CREDITS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clarify research identity for faculty applications"
          git push
