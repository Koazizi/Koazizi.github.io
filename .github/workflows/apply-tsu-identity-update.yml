name: Apply TSU-aligned identity and layout update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tsu-identity-update.yml'

permissions:
  contents: write

jobs:
  apply-site-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Decode and install revised pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          files = {
              '.site_update/index.b64': 'index.html',
              '.site_update/research.b64': 'research.html',
              '.site_update/people.b64': 'people.html',
              '.site_update/refinement.b64': 'assets/css/refinement.css',
              '.site_update/sitemap.b64': 'sitemap.xml',
          }

          for source, destination in files.items():
              encoded = Path(source).read_text(encoding='utf-8').strip()
              decoded = gzip.decompress(base64.b64decode(encoded))
              target = Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(decoded)
              print(f'Updated {destination}: {len(decoded):,} bytes')
          PY
          rm -rf .site_update

      - name: Commit revised website
        shell: bash
        run: |
          git config user.name "Koorosh Azizi"
          git config user.email "KOOROSH.AZIZI.92@GMAIL.COM"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Align website identity with TSU profile and refine layouts"
            git push
          fi
